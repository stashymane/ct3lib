[workspace]
resolver = "3"
members = ["cli", "lib"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.18"
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }

log = "0.4.32"
env_logger = "0.11.10"

texpresso = "2.0.2"
png = "0.18.1"
image = "0.25.10"
