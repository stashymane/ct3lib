on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version name
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      package: 'ct3lib-cli'
      target: ${{ matrix.target }}
      release: true

    strategy:
      matrix:
        target: [ "x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu" ]

  release:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ct3lib-cli-*-release
          path: dist
          merge-multiple: true

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ vars.RELEASE_SUFFIX }}
        run: |
          gh release create "${{ inputs.version || github.ref_name }}" \
            --draft \
            --title "${{ inputs.version || github.ref_name }}" \
            --generate-notes \
            --notes "$RELEASE_NOTES"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.version || github.ref_name }}" dist/*
